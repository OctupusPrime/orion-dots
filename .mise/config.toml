[env]
PROJECT_NAME = "orion-dots"
PROJECT_VERSION = "0.0.1"

[tools]
go = "1.27.1"
node = "24"
watchexec = "latest"

[tasks.install]
description = "Install package dependencies"
run = """
npm --prefix tools/fantasticon install
(cd tools/solar-lookup && go mod download)
(cd tools/tz-lookup && go mod download)
"""

[tasks."build:icons"]
description = "Generate the icon font and icon map"
run = "npm --prefix tools/fantasticon start"

[tasks."build:solar-lookup"]
description = "Build solar-lookup for x86-64 and ARM64"
run = """
mkdir -p bin
(cd tools/solar-lookup && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../bin/solar-lookup-amd64 .)
(cd tools/solar-lookup && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../bin/solar-lookup-arm64 .)
"""

[tasks."build:tz-lookup"]
description = "Build tz-lookup for x86-64 and ARM64"
run = """
mkdir -p bin
(cd tools/tz-lookup && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../bin/tz-lookup-amd64 .)
(cd tools/tz-lookup && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../bin/tz-lookup-arm64 .)
"""

[tasks.dev]
depends = ["build:icons", "build:solar-lookup", "build:tz-lookup"]

[tasks.compile]
depends = ["build:icons", "build:solar-lookup", "build:tz-lookup"]